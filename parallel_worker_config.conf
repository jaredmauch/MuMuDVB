# MuMuDVB Parallel Worker Thread Configuration
# This configuration enables the main worker thread to manage all cards in parallel
# Each card will be tested against all frequencies simultaneously with signal quality tracking

# =============================================================================
# UNIFIED SYSTEM CONFIGURATION
# =============================================================================

# Use auto-detection for cards
unified_cards=auto

# Define all frequencies to test in parallel
unified_frequencies=509000000,551000000,593000000,635000000,677000000,719000000,761000000

# =============================================================================
# PARALLEL WORKER THREAD SETTINGS
# =============================================================================

# Enable parallel card management
parallel_card_management=1

# Maximum concurrent card tests
max_concurrent_cards=4

# Enable signal quality comparison
signal_quality_tracking=1

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Enable full autoconfiguration
autoconfiguration=full

# Network settings
unicast=1
port_http=10000
unicast_queue_size=4194304

# PAT/SDT rewriting
rewrite_pat=1
rewrite_sdt=1
sort_eit=1

# =============================================================================
# SIGNAL QUALITY AND VALIDATION
# =============================================================================

# Timeout settings for parallel testing
tuning_no_diff=5
timeout_no_diff=10

# Signal quality thresholds
min_signal_strength=10000
min_snr=200
max_ber=1000

# Enable channel validation
validate_channels=1

# =============================================================================
# LOGGING AND OUTPUT
# =============================================================================

# Enable detailed logging for parallel operations
log_level=info
log_module=Unified,Parallel,Signal

# Generate comprehensive card/frequency matrix
generate_card_matrix=1
card_matrix_file=/tmp/mumudvb_card_frequency_matrix.txt

# Enable real-time progress reporting
progress_reporting=1
progress_interval=5

# =============================================================================
# CARD SELECTION STRATEGY
# =============================================================================

# Strategy for selecting best card per frequency
# Options: signal_strength, snr, combined_quality, first_available
card_selection_strategy=combined_quality

# Quality scoring weights (for combined_quality strategy)
signal_weight=1.0
snr_weight=0.5
ber_weight=-0.1
