# MuMuDVB Parallel Scanning Configuration
# This configuration enables true parallel scanning of all frequencies on all cards
# Each card will independently test all frequencies simultaneously

# =============================================================================
# PARALLEL SCANNING CONFIGURATION
# =============================================================================

# Use auto-detection for cards and frequencies
unified_cards=auto
unified_frequencies=509000000,551000000,593000000,635000000,677000000,719000000,761000000

# Enable parallel processing
parallel_scanning=1
max_concurrent_scans=4

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Enable full autoconfiguration
autoconfiguration=full

# Network settings
unicast=1
port_http=10000
unicast_queue_size=4194304

# PAT/SDT rewriting
rewrite_pat=1
rewrite_sdt=1
sort_eit=1

# =============================================================================
# PARALLEL SCANNING PARAMETERS
# =============================================================================

# Timeout settings for parallel scanning
tuning_no_diff=5
timeout_no_diff=10

# Enable detailed logging for parallel operations
log_level=info
log_module=Unified,Parallel

# =============================================================================
# CHANNEL COLLECTION SETTINGS
# =============================================================================

# Collect all channels from all frequencies
collect_all_channels=1
channel_collection_timeout=30

# Enable channel validation
validate_channels=1
min_signal_strength=10000

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================

# Generate comprehensive channel list
generate_channel_table=1
channel_table_file=/tmp/mumudvb_parallel_scan_results.txt

# Enable real-time progress reporting
progress_reporting=1
progress_interval=5
