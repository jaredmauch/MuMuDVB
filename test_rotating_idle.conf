# Test configuration for rotating idle card system
# This configuration tests the new LIFO rotating idle card implementation

# =============================================================================
# UNIFIED SYSTEM CONFIGURATION
# =============================================================================

# Enable unified system with multiple cards
unified_cards=0,1,2,3
unified_frequencies=509000000,551000000,593000000,635000000,677000000,719000000,761000000

# Enable parallel scanning with rotating idle card
parallel_scanning=1

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Enable full autoconfiguration
autoconfiguration=full

# Network settings
unicast=1
port_http=10000
unicast_queue_size=4194304

# PAT/SDT rewriting
rewrite_pat=1
rewrite_sdt=1
sort_eit=1

# =============================================================================
# PARALLEL SCANNING PARAMETERS
# =============================================================================

# Timeout settings for parallel scanning
tuning_no_diff=5
timeout_no_diff=10

# Enable detailed logging for parallel operations
log_level=info
log_module=Unified,Parallel

# =============================================================================
# CHANNEL COLLECTION SETTINGS
# =============================================================================

# Collect all channels from all frequencies
collect_all_channels=1
channel_collection_timeout=30

# Enable channel validation
validate_channels=1
min_signal_strength=10000

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================

# Generate comprehensive channel list
generate_channel_table=1
channel_table_file=/tmp/mumudvb_rotating_idle_test_results.txt
