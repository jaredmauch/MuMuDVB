# MuMuDVB Unified Channel System - Troubleshooting Guide
# 
# This file contains common configuration issues and their solutions
# for the unified channel system.

# =============================================================================
# COMMON CONFIGURATION ERRORS
# =============================================================================

# ERROR 1: Mismatched number of tuners and cards
# PROBLEM: Number of tuners doesn't match number of cards
# WRONG:
# unified_tuners=0,1,2,3,4
# unified_cards=0,0,1,1
# SOLUTION: Make sure both lists have the same number of elements
unified_tuners=0,1,2,3
unified_cards=0,0,1,1

# ERROR 2: Invalid frequency format
# PROBLEM: Frequencies not in Hz or using wrong format
# WRONG:
# unified_frequencies=509,515,521  # Missing zeros, not in Hz
# SOLUTION: Use full Hz values
unified_frequencies=509000000,515000000,521000000

# ERROR 3: Duplicate tuner IDs
# PROBLEM: Same tuner ID used multiple times
# WRONG:
# unified_tuners=0,1,1,3  # Tuner 1 appears twice
# SOLUTION: Use unique tuner IDs
unified_tuners=0,1,2,3

# ERROR 4: Invalid card numbers
# PROBLEM: Card numbers don't match installed cards
# WRONG:
# unified_cards=0,0,5,5  # Card 5 doesn't exist
# SOLUTION: Use only installed card numbers
unified_cards=0,0,1,1

# =============================================================================
# DEBUGGING CONFIGURATION
# =============================================================================

# Use this configuration for debugging unified channel system issues
# Enable verbose logging to see what's happening

# Unified system configuration
unified_tuners=0,1,2,3
unified_cards=0,0,1,1
unified_frequencies=509000000,515000000,521000000,539000000,581000000,593000000

# Enable debug logging
log_level=debug
log_module=Unified

# Basic settings
autoconfiguration=full
unicast=1
port_http=10000

# =============================================================================
# TESTING CONFIGURATION
# =============================================================================

# Minimal configuration for testing the unified system
# Start with this to verify basic functionality

# Test with just 2 tuners and 2 frequencies
unified_tuners=0,1
unified_cards=0,0
unified_frequencies=509000000,515000000

# Minimal settings
autoconfiguration=full
unicast=1
port_http=10000

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Configuration optimized for high-performance scenarios
# with many tuners and frequencies

# Many tuners (8 tuners across 4 cards)
unified_tuners=0,1,2,3,4,5,6,7
unified_cards=0,0,1,1,2,2,3,3

# Many frequencies
unified_frequencies=509000000,515000000,521000000,539000000,581000000,593000000,189000000,177000000,563000000,575000000

# Performance settings
autoconfiguration=full
unicast=1
unicast_queue_size=8388608  # Larger buffer for high throughput
port_http=10000

# Optimize for low latency
multicast_ttl=1
rewrite_pat=1
rewrite_sdt=1

# =============================================================================
# COMMON ISSUES AND SOLUTIONS
# =============================================================================

# ISSUE 1: "No tuner available for frequency"
# CAUSE: All tuners that can access the frequency are busy
# SOLUTIONS:
# - Add more tuners that can access the frequency
# - Reduce the number of concurrent clients
# - Check if tuners are properly configured

# ISSUE 2: "Tuner initialization failed"
# CAUSE: Hardware or driver problems
# SOLUTIONS:
# - Check DVB card installation
# - Verify tuner IDs match physical tuners
# - Check card IDs are correct
# - Ensure drivers are properly loaded

# ISSUE 3: "Configuration errors"
# CAUSE: Invalid configuration parameters
# SOLUTIONS:
# - Verify tuner and card lists have same length
# - Check frequency format (must be in Hz)
# - Ensure tuner IDs are unique
# - Validate card numbers exist

# ISSUE 4: "Frequency not accessible"
# CAUSE: No tuner can access the requested frequency
# SOLUTIONS:
# - Check if frequency is in the unified_frequencies list
# - Verify tuners can physically access the frequency
# - Check antenna/cable connections
# - Test frequency with individual tuner first

# =============================================================================
# MONITORING CONFIGURATION
# =============================================================================

# Configuration with monitoring and statistics enabled

unified_tuners=0,1,2,3
unified_cards=0,0,1,1
unified_frequencies=509000000,515000000,521000000,539000000,581000000,593000000

# Enable monitoring
autoconfiguration=full
unicast=1
port_http=10000

# Enable statistics logging
log_level=info
log_module=Unified,Common chan,Autoconf

# Enable SAP announces for monitoring
sap=1
sap_default_group=Unified Channels
sap_organisation=My DVB Server

# =============================================================================
# FALLBACK CONFIGURATION
# =============================================================================

# If unified system fails, fall back to single tuner
# Comment out unified parameters and use traditional configuration

# unified_tuners=0,1,2,3
# unified_cards=0,0,1,1
# unified_frequencies=509000000,515000000,521000000,539000000,581000000,593000000

# Fallback to single tuner
card=0
tuner=0
freq=509000000

# Basic settings
autoconfiguration=full
unicast=1
port_http=10000
