# Migration Example: From Single Tuner to Unified System
# 
# This example shows how to migrate from the traditional single-tuner configuration
# to the new unified channel system that supports multiple tuners and automatic assignment.

# =============================================================================
# BEFORE: TRADITIONAL SINGLE TUNER CONFIGURATION
# =============================================================================

# OLD CONFIGURATION (single tuner, manual assignment):
# card=0
# tuner=0
# freq=189000000 # CBET-DT
# autoconfiguration=full
# common_port=1234
# multicast_ipv4=0
# multicast_ttl=1
# rewrite_pat=1
# rewrite_sdt=1
# sort_eit=1
# unicast=1
# unicast_queue_size=4194304
# port_http=10000+%card

# PROBLEMS WITH OLD SYSTEM:
# - Only one tuner can be used at a time
# - Manual configuration required for each tuner-frequency combination
# - Different ports for different cards (10000+%card)
# - No load balancing or automatic failover
# - Difficult to scale to multiple tuners

# =============================================================================
# AFTER: UNIFIED CHANNEL SYSTEM
# =============================================================================

# NEW CONFIGURATION (unified system, automatic assignment):
# This replaces the above with a system that can handle multiple tuners and frequencies

# Define your tuners (4 tuners: 2 on card 0, 2 on card 1)
unified_tuners=0,1,2,3
unified_cards=0,0,1,1

# Define all frequencies you want to serve
# These will be automatically assigned to available tuners
unified_frequencies=189000000,509000000,515000000,521000000,539000000,581000000,593000000

# Common settings (same as before, but now apply to all tuners)
autoconfiguration=full
common_port=1234
multicast_ipv4=0
multicast_ipv6=0
multicast_ttl=1
rewrite_pat=1
rewrite_sdt=1
sort_eit=1
unicast=1
unicast_queue_size=4194304
port_http=10000

# =============================================================================
# BENEFITS OF THE NEW SYSTEM
# =============================================================================

# 1. AUTOMATIC TUNER ASSIGNMENT
#    - No need to manually specify which tuner handles which frequency
#    - System automatically detects tuner capabilities during startup
#    - Dynamic assignment based on availability

# 2. LOAD BALANCING
#    - If multiple tuners can access the same frequency, clients are distributed
#    - Better resource utilization across all available tuners
#    - Automatic failover if a tuner becomes unavailable

# 3. SINGLE PORT ACCESS
#    - All channels served on port 10000 instead of 10000+%card
#    - Simplified client configuration
#    - Easier firewall and network configuration

# 4. BETTER RESOURCE UTILIZATION
#    - Tuners are used efficiently based on actual demand
#    - No wasted tuners sitting idle
#    - Automatic scaling based on client requests

# 5. EASIER MANAGEMENT
#    - Just list frequencies and tuners, system handles the rest
#    - No need to create separate configurations for each tuner
#    - Centralized configuration for all tuners

# =============================================================================
# CLIENT ACCESS EXAMPLES
# =============================================================================

# OLD WAY (different ports for different cards):
# http://your-server:10000/freq/189000000  -> Card 0, Tuner 0
# http://your-server:10001/freq/509000000  -> Card 1, Tuner 0
# http://your-server:10002/freq/515000000  -> Card 2, Tuner 0

# NEW WAY (single port, automatic assignment):
# http://your-server:10000/freq/189000000  -> CBET-DT (automatically assigned)
# http://your-server:10000/freq/509000000  -> WTVS PBS (automatically assigned)
# http://your-server:10000/freq/515000000  -> (automatically assigned)
# http://your-server:10000/freq/521000000  -> (automatically assigned)
# http://your-server:10000/freq/539000000  -> (automatically assigned)
# http://your-server:10000/freq/581000000  -> (automatically assigned)
# http://your-server:10000/freq/593000000  -> WKBD-HD (automatically assigned)

# =============================================================================
# MIGRATION STEPS
# =============================================================================

# 1. Identify all your tuners and their card assignments
# 2. List all frequencies you want to serve
# 3. Replace individual tuner configurations with unified parameters
# 4. Update client URLs to use the new single-port format
# 5. Test the system to ensure all frequencies are accessible

# =============================================================================
# ADVANCED CONFIGURATION OPTIONS
# =============================================================================

# You can still use individual tuner settings if needed for specific cases:
# card=0
# tuner=0
# freq=509000000
# (This would override the unified system for this specific tuner)

# Optional: SAP announces for channel discovery
#sap=1
#sap_default_group=Unified Channels
#sap_organisation=My DVB Server

# Optional: CAM support for scrambled channels
#cam_support=1

# Optional: Software CAM support
#scam_support=1
