# MuMuDVB Comprehensive Configuration Example
# This file demonstrates various configuration options and best practices

# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================

# Server identification
server_id=1

# Logging configuration
log_type=console
log_file=/var/log/mumudvb.log
log_header="[%date] %priority %module:"
log_flush_interval=10

# Traffic monitoring
show_traffic_interval=30
compute_traffic_interval=5
up_threshold=10000000
down_threshold=5000000

# =============================================================================
# TUNING CONFIGURATION
# =============================================================================

# DVB-T configuration
delivery_system=DVB-T
freq=515000000
bandwidth=8MHz
trans_mode=8k
guardinterval=1/4
coderate=2/3
modulation=QAM64

# Card selection
# Use 'auto' to automatically detect and use the first available card
card=auto
tuner=0

# =============================================================================
# AUTOCONFIGURATION
# =============================================================================

# Enable full autoconfiguration
autoconfiguration=full

# Autoconfiguration settings
autoconf_ip4=239.100.%card.%number
autoconf_ip6=FF15:4242::%server:%card:%number
autoconf_radios=1
autoconf_scrambled=0

# Channel filtering
autoconf_sid_list=101,102,103
autoconf_name_template=%number-%name

# =============================================================================
# UNICAST HTTP CONFIGURATION
# =============================================================================

# Enable HTTP unicast
unicast=1
ip_http=0.0.0.0
port_http=4242

# Advanced unicast settings
unicast_consecutive_errors_timeout=10
unicast_max_clients=50
unicast_queue_size=1048576
socket_sendbuf_size=1048576
flush_on_eagain=0

# TCP optimizations for better performance and reliability
tcp_keepalive=1
tcp_keepalive_idle=30
tcp_keepalive_interval=5
tcp_keepalive_count=3
tcp_window_scaling=1
tcp_selective_acks=1

# Playlist settings
playlist_ignore_dead=1
playlist_ignore_scrambled_ratio=80

# =============================================================================
# HLS (HTTP Live Streaming) CONFIGURATION
# =============================================================================

# Enable HLS output
hls=1
hls_storage_dir=/var/www/html/hls
hls_playlist_name=channels.m3u8
hls_rotate_time=6
hls_rotate_count=3
hls_rotate_iframe=1

# =============================================================================
# MULTICAST CONFIGURATION
# =============================================================================

# Common multicast settings
common_port=1234
multicast_ttl=16
multicast_ipv4=1
multicast_ipv6=0
multicast_auto_join=1
rtp_header=0

# Interface binding
multicast_iface4=eth0
multicast_iface6=eth0

# =============================================================================
# REWRITE CONFIGURATION
# =============================================================================

# Enable PAT/SDT rewriting
rewrite_pat=1
rewrite_sdt=1
rewrite_eit=1
store_eit=1
sdt_force_eit=1

# =============================================================================
# SAP ANNOUNCEMENTS
# =============================================================================

# Enable SAP announcements
sap=1
sap_interval=5
sap_ttl=255
sap_organisation=MuMuDVB
sap_uri=http://example.com/channels
sap_sending_ip4=192.168.1.100
sap_sending_ip6=2001:db8::1
sap_default_group=My Channels

# =============================================================================
# UNIFIED CHANNEL SYSTEM (Multi-Card Setup)
# =============================================================================

# Uncomment to enable unified system
#unified_cards=0,1,2
#unified_frequencies=515000000,551000000,593000000

# =============================================================================
# CHANNEL-SPECIFIC CONFIGURATION
# =============================================================================

# Example channel 1
new_channel
service_id=101
name=Channel 1
ip=239.100.0.101
port=1234
sap_group=News

# Example channel 2
new_channel
service_id=102
name=Channel 2
ip=239.100.0.102
port=1235
sap_group=Entertainment

# Example channel 3
new_channel
service_id=103
name=Channel 3
ip=239.100.0.103
port=1236
sap_group=Sports

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Buffer settings
dvr_buffer_size=40
dvr_thread=0
dvr_thread_buffer_size=100

# Error handling
dont_send_scrambled=0
filter_transport_error=1
check_cc=1

# Timeouts
timeout_no_diff=10
tuning_no_diff=5

# T2-MI settings (if using T2-MI input)
t2mi_pid=4096
t2mi_plp=0

# PID file
filename_pid=/var/run/mumudvb.pid
