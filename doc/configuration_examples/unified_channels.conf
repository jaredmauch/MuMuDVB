# MuMuDVB Unified Channel System Configuration
# This example shows how to configure multiple tuners with automatic frequency assignment
#
# This configuration sets up 4 tuners (2 on card 0, 2 on card 1) to serve 6 frequencies
# The system will automatically detect which tuners can access which frequencies
# and assign clients to available tuners dynamically.

# =============================================================================
# UNIFIED CHANNEL SYSTEM CONFIGURATION
# =============================================================================

# Define the tuners to use (4 tuners total)
unified_tuners=0,1,2,3

# Map each tuner to its DVB card (tuners 0,1 on card 0; tuners 2,3 on card 1)
unified_cards=0,0,1,1

# Define all frequencies to serve (in Hz)
# These will be automatically tested on each tuner during startup
unified_frequencies=509000000,515000000,521000000,539000000,581000000,593000000

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Enable full autoconfiguration for all channels
autoconfiguration=full

# Network settings
common_port=1234
multicast_ipv4=0
multicast_ipv6=0
multicast_ttl=1

# PAT/SDT rewriting (recommended for set-top boxes)
rewrite_pat=1
rewrite_sdt=1
sort_eit=1

# HTTP unicast settings
unicast=1
unicast_queue_size=4194304
port_http=10000

# =============================================================================
# OPTIONAL SETTINGS
# =============================================================================

# SAP announces (optional)
#sap=1
#sap_default_group=Unified Channels
#sap_organisation=My DVB Server

# CAM support for scrambled channels (optional)
#cam_support=1

# Software CAM support (optional)
#scam_support=1
#scam_ring_buffer_size=131072
#scam_decsa_delay=4500000

# =============================================================================
# HOW THE SYSTEM WORKS
# =============================================================================

# 1. During startup, the system tests each tuner with each frequency
# 2. A mapping table is created showing which tuners can access which frequencies
# 3. The system optimizes tuner assignment to use the minimum number of tuners
# 4. When clients connect, they are served by the pre-assigned tuner for that frequency
# 5. Multiple clients can connect to the same frequency - they share the same tuner
# 6. All channels are served on the same HTTP port (10000)

# =============================================================================
# CLIENT ACCESS EXAMPLES
# =============================================================================

# Clients can access channels using these URL patterns:
# http://your-server:10000/freq/509000000  -> 509 MHz (WTVS PBS)
# http://your-server:10000/freq/515000000  -> 515 MHz
# http://your-server:10000/freq/521000000  -> 521 MHz
# http://your-server:10000/freq/539000000  -> 539 MHz
# http://your-server:10000/freq/581000000  -> 581 MHz
# http://your-server:10000/freq/593000000  -> 593 MHz (WKBD-HD)

# =============================================================================
# MULTI-CLIENT SUPPORT
# =============================================================================

# Multiple clients can connect to the same frequency simultaneously:
# - Client 1: http://your-server:10000/freq/509000000
# - Client 2: http://your-server:10000/freq/509000000  
# - Client 3: http://your-server:10000/freq/509000000
# All three clients will be served by the same tuner assigned to 509000000 Hz

# This is much more efficient than having separate tuners per client!

# =============================================================================
# MIGRATION FROM SINGLE TUNER
# =============================================================================

# If you're migrating from single tuner configuration, replace:
# card=0
# tuner=0
# freq=509000000
# port_http=10000+%card
#
# With the unified system configuration above.
