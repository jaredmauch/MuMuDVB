# MuMuDVB Unified Channel System - Detroit ATSC Example
# 
# This example shows how to configure the unified channel system using real w_scan output
# from Detroit ATSC channels. The w_scan output shows 6 frequencies with excellent signal
# quality and multiple services per frequency.

# =============================================================================
# W_SCAN OUTPUT ANALYSIS
# =============================================================================

# From w_scan output:
# A 509000000     8VSB	# Signal: Excellent (-23.2 dBm), SNR: 25.2 dB, Video: HD | Services: WTVS-HD (Ch 56:1), D-KIDS, D-CREAT, D-WORLD, D-MLC
# A 515000000     8VSB	# Signal: Excellent (-29.6 dBm), SNR: 21.7 dB, Video: HD | Services: WWJ-HD (Ch 62:1), StartTV, DABL, FAVE TV, Story
# A 521000000     8VSB	# Signal: Excellent (-31.2 dBm), SNR: 20.4 dB, Video: Unknown | Services: WDWO-CD (Ch 18:1), WDWO-CD, WDWO-CD, WDWO-CD, WDWO-CD, WDWO-CD, WDWO-CD
# A 539000000     8VSB	# Signal: Excellent (-33.6 dBm), SNR: 18.7 dB, Video: HD | Services: WXYZ-HD (Ch 7:1), WXYZ-BN, WXYZ-LF, WXYZ-CT, WMYD-HD (Ch 20:1), HSN, ShopLC
# A 581000000     8VSB	# Signal: Excellent (-25.6 dBm), SNR: 23.5 dB, Video: HD | Services: WDIV-HD (Ch 4:1), H&I, Me TV, COZI, WMYD-AT
# A 593000000     8VSB	# Signal: Excellent (-50.0 dBm), SNR: 27.6 dB, Video: HD | Services: WKBD-HD (Ch 50:1), Comet, Charge, TBD, Nosey, QVC, MeTVToo

# =============================================================================
# UNIFIED CHANNEL SYSTEM CONFIGURATION
# =============================================================================

# Define tuners (assuming 4 tuners across 2 cards)
unified_tuners=0,1,2,3
unified_cards=0,0,1,1

# Define frequencies from w_scan output (in Hz)
# All frequencies show excellent signal quality, so all tuners should be able to access them
unified_frequencies=509000000,515000000,521000000,539000000,581000000,593000000

# =============================================================================
# ATSC-SPECIFIC SETTINGS
# =============================================================================

# ATSC modulation (8VSB as shown in w_scan)
# Note: This would be set per tuner, but in unified system it's handled automatically
# modulation=8VSB

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Enable full autoconfiguration to detect all services
autoconfiguration=full

# Network settings
common_port=1234
multicast_ipv4=1
multicast_ipv6=0
multicast_ttl=2

# PAT/SDT rewriting (important for ATSC)
rewrite_pat=1
rewrite_sdt=1
sort_eit=1

# HTTP unicast settings
unicast=1
unicast_queue_size=4194304
port_http=10000

# =============================================================================
# OPTIONAL SETTINGS
# =============================================================================

# SAP announces for channel discovery
sap=1
sap_default_group=Detroit ATSC Channels
sap_organisation=My DVB Server

# Optional: CAM support (not needed for ATSC, but available)
#cam_support=0

# =============================================================================
# EXPECTED SERVICES PER FREQUENCY
# =============================================================================

# Based on w_scan output, each frequency will provide multiple services:

# 509 MHz - WTVS PBS (Ch 56:1)
# Services: WTVS-HD, D-KIDS, D-CREAT, D-WORLD, D-MLC
# Client access: http://server:10000/freq/509000000

# 515 MHz - WWJ CBS (Ch 62:1) 
# Services: WWJ-HD, StartTV, DABL, FAVE TV, Story
# Client access: http://server:10000/freq/515000000

# 521 MHz - WDWO-CD (Ch 18:1)
# Services: WDWO-CD (multiple subchannels)
# Client access: http://server:10000/freq/521000000

# 539 MHz - WXYZ ABC (Ch 7:1) + WMYD (Ch 20:1)
# Services: WXYZ-HD, WXYZ-BN, WXYZ-LF, WXYZ-CT, WMYD-HD, HSN, ShopLC
# Client access: http://server:10000/freq/539000000

# 581 MHz - WDIV NBC (Ch 4:1)
# Services: WDIV-HD, H&I, Me TV, COZI, WMYD-AT
# Client access: http://server:10000/freq/581000000

# 593 MHz - WKBD FOX (Ch 50:1)
# Services: WKBD-HD, Comet, Charge, TBD, Nosey, QVC, MeTVToo
# Client access: http://server:10000/freq/593000000

# =============================================================================
# LOAD BALANCING SCENARIOS
# =============================================================================

# With 4 tuners and 6 frequencies, the system will:
# - Assign each frequency to an available tuner
# - Load balance multiple clients requesting the same frequency
# - Automatically failover if a tuner becomes unavailable

# Example load balancing:
# - Tuner 0: 509 MHz (WTVS PBS) - 1 client
# - Tuner 1: 515 MHz (WWJ CBS) - 2 clients (load balanced)
# - Tuner 2: 521 MHz (WDWO-CD) - 1 client  
# - Tuner 3: 539 MHz (WXYZ ABC) - 3 clients (load balanced)
# - Tuner 0: 581 MHz (WDIV NBC) - 1 client (tuner 0 now free)
# - Tuner 1: 593 MHz (WKBD FOX) - 2 clients (tuner 1 now free)

# =============================================================================
# SIGNAL QUALITY CONSIDERATIONS
# =============================================================================

# All frequencies show excellent signal quality:
# - 509 MHz: -23.2 dBm, SNR: 25.2 dB (Best signal)
# - 515 MHz: -29.6 dBm, SNR: 21.7 dB (Good signal)
# - 521 MHz: -31.2 dBm, SNR: 20.4 dB (Good signal)
# - 539 MHz: -33.6 dBm, SNR: 18.7 dB (Acceptable signal)
# - 581 MHz: -25.6 dBm, SNR: 23.5 dB (Very good signal)
# - 593 MHz: -50.0 dBm, SNR: 27.6 dB (Good signal despite lower power)

# The unified system will automatically assign tuners based on availability,
# not signal quality, since all frequencies are accessible.

# =============================================================================
# MIGRATION FROM SINGLE TUNER
# =============================================================================

# If you were previously using single tuner configuration:
# card=0
# tuner=0
# freq=509000000
# port_http=10000+%card
#
# The unified system replaces this with automatic assignment of all 6 frequencies
# across 4 tuners, all served on port 10000.

# =============================================================================
# TESTING THE CONFIGURATION
# =============================================================================

# To test this configuration:
# 1. Start MuMuDVB with this config
# 2. Check logs for tuner assignment messages
# 3. Test each frequency URL:
#    curl http://localhost:10000/freq/509000000
#    curl http://localhost:10000/freq/515000000
#    curl http://localhost:10000/freq/521000000
#    curl http://localhost:10000/freq/539000000
#    curl http://localhost:10000/freq/581000000
#    curl http://localhost:10000/freq/593000000
# 4. Verify all services are detected via autoconfiguration
