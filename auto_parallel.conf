# MuMuDVB Auto Parallel Scanning Configuration
# This configuration enables parallel scanning of all frequencies on all cards
# Each card will independently test all frequencies simultaneously

# =============================================================================
# UNIFIED SYSTEM CONFIGURATION
# =============================================================================

# Use auto-detection for cards
unified_cards=auto

# Define all frequencies to test
unified_frequencies=509000000,551000000,593000000,635000000,677000000,719000000,761000000

# =============================================================================
# PARALLEL SCANNING SETTINGS
# =============================================================================

# Enable parallel processing
parallel_scanning=1

# Maximum concurrent scanning threads
max_concurrent_scans=4

# Enable background scanning for all frequencies
background_scan_all=1

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Enable full autoconfiguration
autoconfiguration=full

# Network settings
unicast=1
port_http=10000
unicast_queue_size=4194304

# PAT/SDT rewriting
rewrite_pat=1
rewrite_sdt=1
sort_eit=1

# =============================================================================
# TIMEOUT AND VALIDATION SETTINGS
# =============================================================================

# Timeout settings for parallel scanning
tuning_no_diff=5
timeout_no_diff=10

# Channel validation
validate_channels=1
min_signal_strength=10000

# =============================================================================
# LOGGING AND OUTPUT
# =============================================================================

# Enable detailed logging
log_level=info
log_module=Unified,Parallel,Background

# Generate comprehensive channel list
generate_channel_table=1
channel_table_file=/tmp/mumudvb_parallel_results.txt

# Enable real-time progress reporting
progress_reporting=1
progress_interval=5
